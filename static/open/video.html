<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="initial-scale=1">
    <title>OPEN FILE</title>
    <style>
        html, body, #app {
            height: 100%;
            overflow: hidden;
            margin: 0;
        }
        video {
            object-fit: contain;
            background-color: #181a1b;
        }
        .time {
            position: fixed;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            font-size: 7vw;
            color: #fffdfdba;
        }
        .r0 {
            width: 100%;
            height: 100%;
        }
        .r90 {
            width: 100vh;
            height: 100vw;
            position: fixed;
            left: calc(100vw / 2 - 100vh / 2);
            top: calc(100vh / 2 - 100vw / 2);
        }
        #msg {
            position: absolute;
            top: 0px;
            left: 0px;
            max-height: 200px;
            overflow: auto;
            z-index: 9;
            color: white;
            font-size: 10px;
            width: 100%;
        }
        .inline {
            white-space: nowrap;    /* 强制一行显示 */
            overflow: hidden;       /* 溢出内容隐藏 */
            text-overflow: ellipsis; /* 超出显示省略号 */
        }
        #file_name {
            width: 100%;
            font-size: 10px;
            font-weight: bold;
            position: absolute;
            bottom: 0px;
            left: 0px;
            z-index: 11;
            color: white;
            padding-top: 50px;
        }
        #file_name:hover {
/*            background-color: #ff83000d;*/
        }
        #progress {
            --bg-color: #ff8300;
            height: 3px;
            width: var(--bg-per);
            background-color: var(--bg-color);
            /* background: linear-gradient(to right, 
                    var(--bg-color) 0%, 
                    var(--bg-color) var(--bg-per), 
                    transparent var(--bg-per), 
                    transparent 100%); */
        }
        body:hover .controls {
            opacity: 1;
        }
        .controls {
            position: absolute;
            z-index: 12;
            right: 5px;
            bottom: 5px;
            opacity: 0;
        }
        .controls * {
            font-size: 20px;
            line-height: 19px;
            padding: 1px;
            border: solid 1px #c3c3c3;
            margin-left: 5px;
        }
        /* 禁用默认触摸手势 */
        .distouch, .distouch *{
            touch-action: none;
        }
    </style>
</head>
<body><div id="app">
    <video id="vdo" :class="videoClass" :style="{rotate: videoRotate+'deg'}">
        <source type="video/mp4" :src="source">
    </video>
    <div class="controls">
        <button type="button" onclick="loop()"
            :style="{backgroundColor: videoLoop ? '#00ff51' : ''}">loop</button>
        <button type="button" onclick="rotate()">{{videoRotate}}°</button>
        <button type="button" onclick="fullScreen()">⛶</button>
    </div>
    <div class="time" v-show="mouseType == 'progress'">{{timeCur}}</div>
    <span id="msg"></span>
    <div id="file_name" style="--bg-per:0%">
        {{timeCur}}/{{timeTotal}} {{title}}
        <div id="progress"></div>
    </div>

</div></body>

<script src="../js/config.js?2"></script>
<script src="../js/vue3.global.js"></script>
<!-- <script src="../js/dlnacasts2.min.js"></script> -->

<script>

    /**
     * 操作逻辑：
     *  1. 短按<1s: click
     *    -. 左1/3 快退5s
     *    -. 中1/3 播放暂停
     *    -. 右1/3 快进5s
     *  2. 短按滑动(<1s 需滑动超过事件触发像素数): 进度 声音
     *  3. 长按1s+: 视频加速
     *  4. 长按滑动(1s+ 同2): 加速等级
     */

    const filePath = location.hash.substring(1)
        // ,fingerPx = 600 // ?? 一个大拇哥的像素点 PC(27寸):300 平板(11.5寸):260 手机(6.7寸):600 
        ,speed = [1.25, 1.5, 2, 2.5, 3] // 倍速
        ,slidePx = 10 // 滑动多少px触发事件
        ;
    document.title = decodeURIComponent(filePath.substr(filePath.lastIndexOf('/') + 1));
    let isTouchEv = true
        ,clickEvTime = 0 // 上次click事件的时间 防止click因为响应两个事件被重复触发
        ,startTime = 0 // 开始操作的时间
        ,startTimeout = null
        ,startSecond = '' // 操作时视频当前播放进度 s
        ,startPx, startPy// 鼠标/手指 开始的点
        // 简单测试 从左滑倒右是15分钟左右
        // videoDom.duration: 视频时长
        // 快进秒数 = 滑动像素数 x progressPerPxRatio
        ,progressPerPxRatio = 1
        // ,progressStartPx = 0 // 操作进度 事件触发时的偏移px
        ;
    window.onbeforeunload = ev => {sessionStorage.curTime = vdo.currentTime;}
    const vm = Vue.createApp({
        data() {
            return {
                title: document.title,
                source: openUrl(filePath),
                // source: `/bs/fs/res?path=${encodeURIComponent('/home/liuyao' + location.hash.substring(1))}`,
                timeCur: '0:00',
                currentTime: 0,
                timeTotal: '',
                speedList: speed,
                speedIdx: 2,
                mouseType: null, // progress: 进度;  voice: 音量;  speed: 速度
                videoClass: 'r0',
                // 视频循环
                videoLoop: false,
                // 视频旋转角度
                videoRotate: 0,
                videoWidth: '100vw',
                videoHeight: '100vh',
            }
        },
        watch: {
            videoRotate(nv, ov) {
                this.videoClass = nv / 90 % 2 == 1 ? 'r90' : 'r0';
            },
        },
    }).mount("#app");

    vdo.addEventListener('loadedmetadata', e => {
        progressPerPxRatio = Math.max(0.05, Math.min(vdo.duration/15/60, 1));
        vm.timeTotal = formatTime(vdo.duration);
        // e.target.volume = isMobile() ? 1 : 0.1;
        if (sessionStorage.curTime && sessionStorage.curTime != 'undefined') 
            vdo.currentTime = sessionStorage.curTime;
    });
    vdo.addEventListener('timeupdate', e => {
        let per = (vdo.currentTime / vdo.duration * 100).toFixed(1);
        progress.style.setProperty('--bg-per', `${per}%`);
        vm.timeCur = formatTime(vdo.currentTime);
        vm.currentTime = vdo.currentTime;
    });

    file_name.addEventListener('click', e => {
        vdo.currentTime = (e.offsetX / e.target.offsetWidth * vdo.duration).toFixed();
    });

    (async function init() {
        // let filePathPre = filePath.slice(0, filePath.lastIndexOf('.') + 1)
        // let captionsSuffix = ['srt', 'vtt', ] // 'ssa', 'ass'
        // let text = await fetchTextFile(filePathPre+'srt');
        // console.log(text);
    })()

    /**
     * @param t 秒数
     */
    function formatTime(t) {
        let hour = Math.floor(t / 3600);
        let minute = Math.floor(t % 3600 / 60);
        minute = minute < 10 ? ('0' + minute) : minute;
        let second = Math.floor(t % 60);
        second = second < 10 ? ('0' + second) : second;
        if (hour > 0) {
            return `${hour}:${minute}:${second}`;
        }
        return `${minute}:${second}`;
    }

    function loop() {
        vdo.loop = vm.videoLoop = !vm.videoLoop;
    }
    function rotate() {
        vm.videoRotate = (vm.videoRotate + 90)%360;
    }
    function fullScreen() {
        if (!document.fullscreenElement && !document.webkitFullscreenElement) {
            if (vdo.webkitEnterFullscreen) {
                vdo.webkitEnterFullscreen();
            } else if (vdo.requestFullscreen) {
                vdo.requestFullscreen();
            } else if (vdo.webkitRequestFullscreen) {
                vdo.webkitRequestFullscreen();
            }
        } else {
            if (document.exitFullscreen) {
                document.exitFullscreen();
            } else if (document.webkitExitFullscreen) {
                document.webkitExitFullscreen();
            }
        }
    }

    function mouseStart(e, p) {
        if (startTime > 0) return; // 由于浏览器touch事件和mouse事件会重复触发，这里加一个防多触发机制
        startTime = Date.now();
        // offsetX 会受内部元素影响
        [startPx, startPy] = [p.clientX, p.clientY];
        startSecond = vdo.currentTime;
        startTimeout = setTimeout(() => {
            vm.mouseType = 'speed';
            vdo.playbackRate = vm.speedList[vm.speedIdx];
            showMsg(`speed(${vdo.playbackRate})`);
        }, 1000);
    }

    function mouseMove(e, p) {
        if (0 == startTime) return;
        // 滑动的尺寸
        let x = p.clientX - startPx, y = p.clientY - startPy;
        if (!vm.mouseType) {
            if (x > slidePx || x < -slidePx) {
                vm.mouseType = 'progress';
                startPx = p.clientX;
            } else if(y > slidePx || y < -slidePx) {
                vm.mouseType = 'voice';
            } else {
                return;
            }
        }
        clearTimeout(startTimeout);
        switch(vm.mouseType) {
            case 'progress':
                vm.currentTime = startSecond + (x * progressPerPxRatio).toFixed()*1;
                vm.timeCur = formatTime(vm.currentTime);
                break;
            case 'speed':

                break;
        }
    }

    function mouseEnd(e) {
        if (0 == startTime) return;
        clearTimeout(startTimeout);
        switch(vm.mouseType) {
            case 'progress':
                vdo.currentTime = vm.currentTime;
                break;
            case 'speed':
                vdo.playbackRate = 1;
                break;
            case 'voice':
                break;
            default:
                mouseClick(e);
                break;
        }
        startTime = 0;
        vm.mouseType = null;
    }

    function mouseClick(e) {
        let wsplit = window.innerWidth / 3;
        if (startPx < wsplit) {
            vdo.currentTime -= 5;
        } else if (startPx < wsplit * 2) {
            vdo.paused ? vdo.play() : vdo.pause();
        } else {
            vdo.currentTime += 5;
        }
    }

    function funcNoRepeat(func, ...args) {
        if (Date.now() - clickEvTime < 300) return;
        func(...args);
        clickEvTime = Date.now();
    }
    
    // alert(`ua: ${navigator.userAgent}\ntouch:${navigator.maxTouchPoints}`);
    // if (isTouch()) {
        // 禁用长按打开右键菜单
        vdo.addEventListener('contextmenu', e => e.preventDefault());
    // }

    vdo.addEventListener('touchstart', e => doMouseEvent(mouseStart, e, e.touches[0]) );
    vdo.addEventListener('touchmove', e => doMouseEvent(mouseMove, e, e.touches[0]) );
    vdo.addEventListener('touchend', e => doMouseEvent(mouseEnd, e, e.touches[0]) );

    vdo.addEventListener('mousedown', e => doMouseEvent(mouseStart, e, e) );
    vdo.addEventListener('mousemove', e => doMouseEvent(mouseMove, e, e) );
    vdo.addEventListener('mouseup', e => doMouseEvent(mouseEnd, e, e) );

    // 虽然 触摸屏+鼠标能统一 但是会受浏览器原生触摸事件影响
    // vdo.addEventListener('pointerdown', e => mouseStart(e, e));
    // vdo.addEventListener('pointermove', mouseMove);
    // vdo.addEventListener('pointerup', e => mouseEnd(e, e));

    // 禁用点击视频播放
    vdo.addEventListener('click', e => {
        // showMsg('click' + e.clientX);
        // mouseClick(e);
        // e.preventDefault();
    });

    function doMouseEvent(func, e, p) {
        // showMsg(`${e.type}: t-${e.touches ? e.touches.length : 0} b-${e.buttons} (${p ? p.clientX.toFixed() : ''}, ${p ? p.clientY.toFixed() : ''})`);
        e.preventDefault(); // 关键！阻止后续鼠标事件
        func(e, p);
    }
    function showMsg(msg) {
        let msgd = document.getElementById('msg');
        msgd.innerHTML = `${msg}<br>`;
        msgd.scrollTop = msgd.scrollHeight;
    }
</script>
</html>
