<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=0.8">
    <!-- 初始缩放 -->
    <meta name="viewport" content="initial-scale=0.6">
    <title>FILE SYSTEM</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/theme.css"/>
    <link rel="stylesheet" href="css/icon.css"/>
    <link rel="stylesheet" href="css/main.css"/>
</head>
<body>
<div id="app">
    <!-- <link v-if="isMobile" rel="stylesheet" href="css/phone.css"/> -->
    <div v-if="mode == 'pic'" class="pic-main">
        <div class="pic-header">
            <button class="upload" @click="uploadFile()">上传</button>
            <span @click="toggleShowHidden" class="name-btn" :class="showHidden ? 'name-btn-sel' : ''">显隐</span>
            <span v-for="(m, i) in modeList" @click="switchMode(m.value)" class="name-btn" :class="mode == m.value ? 'name-btn-sel' : ''">{{m.label}}</span>
            <span v-for="(s, i) in sortList" @click="sortClick(s.column)" class="name-btn" :class="getSortIcon(s.column)">{{s.label}}</span>
            <br v-if="isMobile">
            <span v-for="(row, i) in pagePath" class="folder path" :class="i == 0 ? 'first-path' : ''" @click="gotoPagePath(i)">{{row}}</span>
            <span v-html="msg"></span>
        </div>
        <div class="pic-body" @wheel="picBodyScroll">
            <div v-for="(row, i) in files" class="pic-item">
                <div class="pic-preview" @click="clickName(row)" v-html="row.preview"></div>
                <div v-if="!row.dir" class="pic-size">{{row.sizeStr}}</div>
                <!-- <div class="pic-time">{{row.timeStr}}</div> -->
                <div class="pic-name" v-html="row.nameHtml"></div>
            </div>
        </div>
        <input type="text" v-model="filterText" class="filter">
    </div>
    <div v-if="mode == 'column'">
        <div class="pic-header">
            <button class="upload" @click="uploadFile()">上传</button>
            <span @click="toggleShowHidden" class="name-btn" :class="showHidden ? 'name-btn-sel' : ''">显隐</span>
            <span v-for="(m, i) in modeList" @click="switchMode(m.value)" class="name-btn" :class="mode == m.value ? 'name-btn-sel' : ''">{{m.label}}</span>
            <span v-for="(s, i) in sortList" @click="sortClick(s.column)" class="name-btn" :class="getSortIcon(s.column)">{{s.label}}</span>
            <span v-html="msg"></span>
        </div>
        <div v-for=""></div>

    </div>
    <table v-if="mode == 'list'" class="list-main">
        <!-- 添加这个dom 解决首行跨列导致的宽度失效 -->
        <colgroup>
            <!-- <col class="col-preview"> -->
            <col class="col-name">
            <col class="col-size">
            <col class="col-time" v-if="!isMobile">
            <col class="col-operate">
        </colgroup>
        <thead class="fix-th">
            <tr><td colspan="6" class="top">
                <span v-for="(row, i) in pagePath" class="folder path" :class="i == 0 ? 'first-path' : ''" @click="gotoPagePath(i)">{{row}}</span> 
                <span v-html="msg"></span>
            </td></tr>
            <tr class="th-bg">
                <!-- <td>预览</td> -->
                <td class="col-name">
                    <span @click="sortClick('name')" :class="getSortIcon('name')">名称</span>
                    <span @click="toggleShowHidden" class="name-btn" :class="showHidden ? 'name-btn-sel' : ''">显隐</span>
                    <span v-for="(m, i) in modeList" @click="switchMode(m.value)" class="name-btn" :class="mode == m.value ? 'name-btn-sel' : ''">{{m.label}}</span>
                    <button class="upload" @click="uploadFile()">上传</button> 
                </td>
                <td><span @click="sortClick('size')" :class="getSortIcon('size')">大小</span></td>
                <td v-if="!isMobile"><span @click="sortClick('time')" :class="getSortIcon('time')">修改时间</span></td>
                <td>操作</td>
            </tr>
            <tr>
                <td class="path-prev folder col-name" @click="folderLeave()">.. </td>
                <td colspan="4"><input type="text" v-model="filterText" style="width: 100%;"></td>
            </tr>
        </thead>
        <tbody>
            <tr v-for="(row, i) in files">
                <!-- <td v-html="row.preview" class="col-preview"></td> -->
                <td :title="row.name" @click="clickName(row)" class="col-name tb-name">
                    <span v-html="row.preview"></span>
                    <!-- <span :style="{fontSize: isMobile && row.nameLen > 32 ? '12px' : ''}" :class="row.dir ? 'folder' : 'file'" >{{row.name}}</span> -->
                    <span :class="row.dir ? 'folder' : 'file'" v-html="row.nameHtml"></span>
                </td>
                <td>{{row.sizeStr}}</td>
                <td v-if="!isMobile">{{row.timeStr}}</td>
                <td v-if="row.fsType=='folder'">-</td>
                <td v-else>
                    <span class="funcBtn" @click="openText(row)">文本</span>
                    <span class="funcBtn" @click="downloadFile(row.name)">下载</span>
                </td>
            </tr>
        </tbody>
    </table>

    <div class="msgBox" v-show="msgList.length > 0">
        <div class="close" @click="msgList=[]">✘</div>
        <ol><li class="msgBoxLine" v-for="(row, i) in msgList" v-html="row"></li></ol>
    </div>

</div>
</body>

<mode-switch v-model="mode"></mode-switch>
<mode-switch v-model="mode"></mode-switch>
<script type="text/html" id="mode-switch-tpl">
    <span @click="$emit('update:modelValue', 'list')"   class="name-btn" :class="modelValue === 'list'   ? 'name-btn-sel' : ''">列表</span>
    <span @click="$emit('update:modelValue', 'column')" class="name-btn" :class="modelValue === 'column' ? 'name-btn-sel' : ''">分栏</span>
    <span @click="$emit('update:modelValue', 'pic')"    class="name-btn" :class="modelValue === 'pic'    ? 'name-btn-sel' : ''">图片</span>
</script>
<script>
/**

     1. 用户点击 span。
     2. 组件内 $emit('update:modelValue', 'pic') 触发事件，携带 'pic'。
     3. 父组件的 @update:modelValue 监听器执行 modeA = 'pic'。
     4. modeA 更新，再通过 :modelValue 传回子组件，子组件高亮对应按钮。
 */
