[package]
name = "file-system"
version = "0.1.0"
edition = "2024"

[dependencies]
# 可返回通用异常
anyhow = "1.0"
# http服务器
axum = "0.8"
axum-extra = { version = "0.12.5", features = ["multipart"] }
base64 = "0.22.1"
home = "0.5.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.53.1", features = ["full"] }